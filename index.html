<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Swasth 3D Attendance Planner</title>
    <style>
        :root {
            bg-primary: #0f172a;
            bg-secondary: #1e293b;
            accent: #06b6d4;
            text-main: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            text-shadow: 0 4px 10px rgba(6,182,212,0.4);
        }
        .dashboard-container {
            max-width: 1400px;
            margin: auto;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1);
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        select, button {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 6px 15px rgba(6,182,212,0.3);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        select { background: #1e293b; border: 1px solid #334155; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(6,182,212,0.5); }
        
        .legend {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .legend-badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .badge-L { background: #ef4444; }
        .badge-FH { background: #f59e0b; }
        .badge-SH { background: #8b5cf6; }
        .badge-H { background: #10b981; }
        .badge-A { background: #64748b; }

        .group-section {
            margin-bottom: 30px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 14px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .group-title {
            color: #06b6d4;
            font-size: 1.2rem;
            margin-bottom: 12px;
            border-bottom: 2px solid rgba(6,182,212,0.3);
            padding-bottom: 6px;
        }
        .divider-line {
            height: 3px;
            background: linear-gradient(to right, transparent, #ef4444, transparent);
            margin: 25px 0;
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 4px;
            overflow-x: auto;
            display: block;
        }
        th, td {
            padding: 8px;
            text-align: center;
            font-size: 0.85rem;
        }
        th { background: rgba(255,255,255,0.05); border-radius: 6px; }
        td.day-cell {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        td.day-cell:hover {
            background: rgba(6,182,212,0.2);
            transform: scale(1.05);
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }
        .close-btn { float: right; cursor: pointer; color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>M-Swasth 3D Attendance & Leave Planner</h1>
        
        <div class="controls">
            <div>
                <label>Year: </label>
                <select id="yearSelect" onchange="renderCalendar()">
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>
                <label>Month: </label>
                <select id="monthSelect" onchange="renderCalendar()">
                    <option value="0">January</option>
                    <option value="1">February</option>
                    <option value="2">March</option>
                    <option value="3">April</option>
                    <option value="4">May</option>
                    <option value="5">June</option>
                    <option value="6">July</option>
                    <option value="7">August</option>
                    <option value="8" selected>September</option>
                    <option value="9">October</option>
                    <option value="10">November</option>
                    <option value="11">December</option>
                </select>
            </div>
            <div>
                <button onclick="saveAttendance()">Sync to Google Sheet</button>
            </div>
        </div>

        <div class="legend">
            <span class="legend-badge badge-L">L: Leave</span>
            <span class="legend-badge badge-FH">FH: First Half</span>
            <span class="legend-badge badge-SH">SH: Second Half</span>
            <span class="legend-badge badge-H">H: Holiday</span>
            <span class="legend-badge badge-A">A: Absent</span>
        </div>

        <!-- Agents Section (Red Line Upper) -->
        <div class="group-section">
            <div class="group-title">Agents / Executives (Upper Section)</div>
            <div id="agentsGrid"></div>
        </div>

        <div class="divider-line" title="Red Line Division"></div>

        <!-- Pharmacists Section (Lower Section) -->
        <div class="group-section">
            <div class="group-title">Pharmacist Executives (Lower Section)</div>
            <div id="pharmacistsGrid"></div>
        </div>
    </div>

    <!-- Drilldown Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">✕</span>
            <h3 id="modalDateTitle">Date Details</h3>
            <div id="modalBody">Click a cell to inspect.</div>
        </div>
    </div>

    <script>
        // Sample dataset derived from image structure mapping
        const agents = [
            { name: "Amit Sharma", id: "MS01219" },
            { name: "Apurv Acharya", id: "MS00462" },
            { name: "Isha Mehta", id: "MS00054" },
            { name: "Pooja Rathore", id: "MS01266" }
        ];

        const pharmacists = [
            { name: "Abuzar Akhtar", id: "MS01347" },
            { name: "Anjali Gupta", id: "MS00945" },
            { name: "ANLUR KUMAR", id: "MS02489" },
            { name: "BHAVNA KEWAT", id: "MS01283" }
        ];

        // Local state store for marked leaves { "empId_YYYY-MM-DD": "L" }
        let attendanceStore = {};

        function getDaysInMonth(year, month) {
            return new Date(year, month + 1, 0.getDate)?.() || new Date(year, month + 1, 0).getDate();
        }

        function renderCalendar() {
            const year = parseInt(document.getElementById('yearSelect').value);
            const month = parseInt(document.getElementById('monthSelect').value);
            const daysCount = new Date(year, month + 1, 0).getDate();

            buildSection('agentsGrid', agents, year, month, daysCount);
            buildSection('pharmacistsGrid', pharmacists, year, month, daysCount);
        }

        function buildSection(containerId, list, year, month, daysCount) {
            let html = `<table><thead><tr><th>Emp Name (ID)</th>`;
            for(let d=1; d<=daysCount; d++) {
                html += `<th>${d}</th>`;
            }
            html += `</tr></thead><tbody>`;

            list.forEach(emp => {
                html += `<tr><td style="text-align:left; white-space:nowrap;">${emp.name}<br><small style="color:#94a3b8">${emp.id}</small></td>`;
                for(let d=1; d<=daysCount; d++) {
                    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const key = `${emp.id}_${dateStr}`;
                    const val = attendanceStore[key] || '';
                    html += `<td class="day-cell" onclick="cycleStatus('${emp.id}', '${emp.name}', '${dateStr}')">${val}</td>`;
                }
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            document.getElementById(containerId).innerHTML = html;
        }

        function cycleStatus(empId, empName, dateStr) {
            const key = `${empId}_${dateStr}`;
            const order = ['', 'L', 'FH', 'SH', 'H', 'A'];
            const current = attendanceStore[key] || '';
            const nextIdx = (order.indexOf(current) + 1) % order.length;
            if(order[nextIdx] === '') delete attendanceStore[key];
            else attendanceStore[key] = order[nextIdx];
            renderCalendar();
            showDateSummary(dateStr);
        }

        function showDateSummary(dateStr) {
            document.getElementById('modalDateTitle').innerText = `Leaves/Status for ${dateStr}`;
            let html = `<ul>`;
            let found = false;
            [...agents, ...pharmacists].forEach(emp => {
                const val = attendanceStore[`${emp.id}_${dateStr}`];
                if(val) {
                    html += `<li><b>${emp.name}</b> (${emp.id}) -> <span class="legend-badge badge-${val}">${val}</span></li>`;
                    found = true;
                }
            });
            html += found ? `</ul>` : `<p>No leaves marked for this date yet. Tap cells to cycle status.</p>`;
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function saveAttendance() {
            // Integration hook with Google Apps Script WebApp URL
            alert('Data synced state ready for Google Sheets backend endpoint connection.');
        }

        window.onload = renderCalendar;
    </script>
</body>
</html>
