<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Swasth Calendar Leave Planner</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        .calendar-container { max-width: 1100px; margin: auto; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); border-radius: 20px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .add-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; padding: 10px 18px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(245,158,11,0.4); }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
        .cal-header-day { font-weight: bold; text-align: center; color: #94a3b8; font-size: 0.85rem; padding: 5px; }
        .cal-cell { background: rgba(255,255,255,0.03); min-height: 100px; border-radius: 12px; padding: 8px; border: 1px solid rgba(255,255,255,0.08); font-size: 0.78rem; overflow-y: auto; transition: 0.2s; }
        .cal-cell:hover { border-color: rgba(6,182,212,0.5); background: rgba(255,255,255,0.05); }
        .cal-cell-num { font-weight: bold; margin-bottom: 6px; color: #06b6d4; font-size: 0.9rem; }
        
        .chip { padding: 3px 6px; border-radius: 6px; margin-bottom: 4px; font-size: 0.7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-weight: 600; }
        .chip-agent { background: rgba(59, 130, 246, 0.25); color: #93c5fd; border-left: 3px solid #3b82f6; }
        .chip-pharmacist { background: rgba(16, 185, 129, 0.25); color: #6ee7b7; border-left: 3px solid #10b981; }

        .status-tag { float: right; font-size: 0.65rem; background: rgba(0,0,0,0.3); padding: 1px 4px; border-radius: 4px; }

        /* Fixed Bottom Action & Filter Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.1); padding: 14px; display: flex; justify-content: center; gap: 15px; z-index: 100; flex-wrap: wrap; }
        .nav-btn { background: #1e293b; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1); padding: 10px 24px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .nav-btn.active { background: linear-gradient(135deg, #06b6d4, #3b82f6); color: white; border-color: transparent; box-shadow: 0 0 20px rgba(6,182,212,0.4); }

        /* Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); backdrop-filter:blur(5px); justify-content:center; align-items:center; z-index:200; }
        .modal-box { background: #1e293b; padding: 25px; border-radius: 16px; width: 340px; display: flex; flex-direction: column; gap: 12px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
        .modal-box label { font-size: 0.85rem; color: #94a3b8; font-weight: 600; }
        select, input { padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; font-size: 0.9rem; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .btn-cancel { background: #334155; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-save { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="header">
            <h2>📅 September 2026 Leave Calendar</h2>
            <button class="add-btn" onclick="openModal()">+ Advance Leave Mention</button>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
    </div>

    <div style="height: 90px;"></div>

    <!-- Bottom Filter/Toggle Buttons -->
    <div class="bottom-nav">
        <button class="nav-btn active" id="btn-all" onclick="filterView('ALL')">👥 All Team</button>
        <button class="nav-btn" id="btn-agent" onclick="filterView('AGENT')">🛡️ Agents (Upper)</button>
        <button class="nav-btn" id="btn-pharmacist" onclick="filterView('PHARMACIST')">💊 Pharmacist (Lower)</button>
    </div>

    <!-- Modal for adding advance leave -->
    <div id="leaveModal" class="modal">
        <div class="modal-box">
            <h3 style="margin:0 0 10px 0; color:#06b6d4;">Mention Advance Leave</h3>
            <label>Group Category (Pic Division):</label>
            <select id="groupType" onchange="updateEmpDropdown()">
                <option value="AGENT">Agent / Exec (Upper Section)</option>
                <option value="PHARMACIST">Pharmacist (Lower Section)</option>
            </select>
            
            <label>Select Team Member:</label>
            <select id="empSelect"></select>
            
            <label>Date (September 2026):</label>
            <select id="dateSelect"></select>
            
            <label>Leave Type:</label>
            <select id="statusSelect">
                <option value="L">Leave (L)</option>
                <option value="FH">First Half (FH)</option>
                <option value="SH">Second Half (SH)</option>
                <option value="H">Holiday (H)</option>
                <option value="A">Absent (A)</option>
            </select>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-save" onclick="saveLeave()">Save Plan</button>
            </div>
        </div>
    </div>

    <script>
        // Sample data mapped from image structure [cite: 2]
        const agentsList = [
            { name: "Amit Sharma", id: "MS01219" },
            { name: "Apurv Acharya", id: "MS00462" },
            { name: "Isha Mehta", id: "MS00054" },
            { name: "Pooja Rathore", id: "MS01266" },
            { name: "Saurav Pal", id: "MS00405" }
        ];
        const pharmacistList = [
            { name: "Abuzar Akhtar", id: "MS01347" },
            { name: "Anjali Gupta", id: "MS00945" },
            { name: "Ashok Pawar", id: "MS02549" },
            { name: "Shivam Verma", id: "MS02491" },
            { name: "Yashwant Singh", id: "MS00098" }
        ];

        let leaves = [
            { empId: "MS01219", name: "Amit Sharma", group: "AGENT", date: 10, status: "L" },
            { empId: "MS02549", name: "Ashok Pawar", group: "PHARMACIST", date: 12, status: "FH" },
            { name: "Isha Mehta", empId: "MS00054", group: "AGENT", date: 15, status: "SH" }
        ];

        let currentFilter = 'ALL';

        function init() {
            populateModalDropdowns();
            renderCalendar();
        }

        function populateModalDropdowns() {
            let dSelect = document.getElementById('dateSelect');
            dSelect.innerHTML = '';
            for(let i=1; i<=30; i++) {
                dSelect.innerHTML += `<option value="${i}">2026-09-${String(i).padStart(2,'0')}</option>`;
            }
            updateEmpDropdown();
        }

        function updateEmpDropdown() {
            let g = document.getElementById('groupType').value;
            let list = g === 'AGENT' ? agentsList : pharmacistList;
            let eSelect = document.getElementById('empSelect');
            eSelect.innerHTML = '';
            list.forEach(item => {
                eSelect.innerHTML += `<option value="${item.id}" data-name="${item.name}">${item.name} (${item.id})</option>`;
            });
        }

        function filterView(type) {
            currentFilter = type;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${type.toLowerCase()}`).classList.add('active');
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const daysInMonth = 30;
            
            ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
                grid.innerHTML += `<div class="cal-header-day">${d}</div>`;
            });

            // Blank padding for alignment offset (assuming Sept 2026 starts on Tuesday -> 2 blanks)
            for(let blank=0; blank<2; blank++) {
                grid.innerHTML += `<div class="cal-cell" style="opacity:0.2; pointer-events:none;"></div>`;
            }

            for(let d=1; d<=daysInMonth; d++) {
                let cell = document.createElement('div');
                cell.className = 'cal-cell';
                
                let dayLeaves = leaves.filter(l => l.date === d && (currentFilter === 'ALL' || l.group === currentFilter));
                let chipsHtml = '';
                dayLeaves.forEach(l => {
                    let cls = l.group === 'AGENT' ? 'chip-agent' : 'chip-pharmacist';
                    chipsHtml += `<div class="chip ${cls}" title="${l.name} - ${l.empId}"><span>${l.name.split(' ')[0]}</span><span class="status-tag">${l.status}</span></div>`;
                });

                cell.innerHTML = `<div class="cal-cell-num">${d}</div>${chipsHtml}`;
                grid.appendChild(cell);
            }
        }

        function openModal() { document.getElementById('leaveModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('leaveModal').style.display = 'none'; }

        function saveLeave() {
            let g = document.getElementById('groupType').value;
            let eSelect = document.getElementById('empSelect');
            let empId = eSelect.value;
            let name = eSelect.options[eSelect.selectedIndex].getAttribute('data-name');
            let date = parseInt(document.getElementById('dateSelect').value);
            let status = document.getElementById('statusSelect').value;
            
            leaves.push({ empId, name, group: g, date, status });
            closeModal();
            renderCalendar();
        }

        window.onload = init;
    </script>
</body>
</html>
